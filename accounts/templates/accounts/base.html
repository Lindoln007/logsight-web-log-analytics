<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}LogSight{% endblock %}</title>
    <link rel="icon" type="image/png" href="/assets/logsight-logo.png?v=20260330c" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/styles.css?v=20260330b" />
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900 antialiased">
    <div class="min-h-screen bg-[radial-gradient(circle_at_top,_rgba(99,102,241,0.14),_transparent_42%),linear-gradient(180deg,_#f8fafc_0%,_#eef2ff_100%)]">
      <header class="mx-auto flex w-full max-w-6xl items-center justify-between px-6 py-5">
        <a href="/" class="flex items-center gap-3 text-slate-900">
          <span class="brand-mark-shell shrink-0">
            <img src="/assets/logsight-logo.png?v=20260330c" alt="" class="brand-mark-image" />
          </span>
          <span class="text-lg font-semibold">LogSight</span>
        </a>
        <nav class="flex items-center gap-3 text-sm">
          {% if user.is_authenticated %}
            <a href="{% url 'accounts:profile' %}" class="rounded-lg px-3 py-2 text-slate-700 transition hover:bg-white/70">Profile</a>
            <form method="post" action="{% url 'accounts:logout' %}">
              {% csrf_token %}
              <button type="submit" class="rounded-lg bg-slate-900 px-4 py-2 font-medium text-white transition hover:bg-slate-800">Logout</button>
            </form>
          {% else %}
            <a href="{% url 'accounts:login' %}" class="rounded-lg px-3 py-2 text-slate-700 transition hover:bg-white/70">Login</a>
            <a href="{% url 'accounts:register' %}" class="rounded-lg bg-slate-900 px-4 py-2 font-medium text-white transition hover:bg-slate-800">Create account</a>
          {% endif %}
        </nav>
      </header>
      <main class="mx-auto flex min-h-[calc(100vh-88px)] w-full max-w-6xl items-center justify-center px-6 py-10">
        <div class="w-full max-w-md rounded-3xl border border-white/60 bg-white/85 p-8 shadow-2xl shadow-slate-300/40 backdrop-blur">
          {% if messages %}
            <div class="mb-4 space-y-2">
              {% for message in messages %}
                <div class="rounded-xl border border-indigo-200 bg-indigo-50 px-4 py-3 text-sm text-indigo-700">
                  {{ message }}
                </div>
              {% endfor %}
            </div>
          {% endif %}
          {% block content %}{% endblock %}
        </div>
      </main>
    </div>
  </body>
</html>
