{% extends "accounts/base.html" %}
{% block title %}Password changed · LogSight{% endblock %}

{% block content %}
  <div>
    <p class="kicker">Account recovery</p>
    <h1 class="auth-title">Password changed</h1>
    <p class="auth-text">Your new password is saved. Use it the next time you sign in.</p>
  </div>
  <div class="notice notice-good" role="status">
    <svg class="icon"><use href="#i-check" /></svg>
    <span>Any reset links sent earlier have stopped working.</span>
  </div>
  <a class="btn btn-primary btn-lg btn-block" href="{% url 'accounts:login' %}">Sign in</a>
{% endblock %}
